# Build the release artifact FROM THE TAG, so provenance is mechanical rather than a
# claim someone makes in a chat window.
#
# v0.1.0's zip was built on a laptop. The tree happened to be clean and the commit
# happened to be right, but nothing about the artifact proved either — "I checked" is a
# process argument, and Swift builds embed absolute paths and timestamps, so a later
# rebuild cannot byte-compare its way to a verdict. The fix is to move the build to a
# machine whose starting state is a fresh checkout of the tag and whose every step is in
# the log.
#
# This workflow REFUSES more than it builds. The build itself is three lines; the rest is
# five assertions, each guarding a way this could ship something wrong while staying
# green. That ratio is deliberate and matches the check-*.sh scripts: a release job that
# only builds is a release job that will eventually publish an x86_64 binary, or a zip
# whose Info.plist disagrees with its own tag, and say nothing.
#
# Cutting a release:
#   1. bump VERSION in app/Scripts/make-app-bundle.sh, commit it
#   2. git tag vX.Y.Z && git push origin vX.Y.Z
#   3. this runs; the zip, DMG, and their .sha256 checksums appear on the release
# Forget step 1 and step 3 fails loudly on the tag/bundle mismatch, which is the entire
# point of asserting it.

name: release

on:
  push:
    tags: ['v*']
  # Backfill or retry without moving a tag. Takes an EXISTING tag; it never creates one,
  # because a workflow that can mint tags can mint them at the wrong commit.
  #
  # Caveat worth knowing rather than engineering around: a locally-referenced reusable
  # workflow always runs at the CALLER's sha. On a tag push that is the tag, so the gates
  # test exactly what ships. On a manual dispatch the gates run at the ref you dispatched
  # from (normally main) while the build checks out the input tag — so a backfill proves
  # "main's gates pass and the tag builds", not "the tag's gates pass". For the primary
  # path, tag push, there is no gap.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach to (e.g. v0.1.0)'
        required: true

permissions:
  contents: read

jobs:
  # The gates run against the tag before anything is published. A tag can point at a
  # commit that never saw CI — pushed from a laptop, or moved — so "main was green" is not
  # evidence about THIS artifact. Reuses checks.yml rather than restating its gate list:
  # two lists would drift, and the one that drifts is always the one nobody runs.
  verify:
    uses: ./.github/workflows/checks.yml

  release:
    needs: verify
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write  # only this job writes; uploading a release asset needs it

    steps:
      - uses: actions/checkout@v5
        with:
          # On a tag push github.ref IS the tag. On workflow_dispatch it is the branch the
          # run was started from, which would silently build main and label it with the
          # tag — so the input wins when present.
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve tag and assert it matches the bundle version
        id: v
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"

          # make-app-bundle.sh hardcodes VERSION and stamps it into Info.plist. Nothing
          # ties it to the tag, so a forgotten bump ships vX.Y.Z containing the previous
          # version — visible only in About, which nobody opens. Fail here instead.
          SCRIPT_VERSION="$(grep -m1 '^VERSION=' app/Scripts/make-app-bundle.sh | cut -d'"' -f2)"
          if [ "$TAG" != "v$SCRIPT_VERSION" ]; then
            echo "::error::tag $TAG disagrees with make-app-bundle.sh VERSION=$SCRIPT_VERSION."
            echo "::error::Bump VERSION to ${TAG#v}, commit, and re-tag — or the zip will misreport itself."
            exit 1
          fi
          echo "tag=$TAG"        >> "$GITHUB_OUTPUT"
          echo "asset=GoblinPortal-$TAG.zip" >> "$GITHUB_OUTPUT"
          echo "  tag=$TAG  bundle version=$SCRIPT_VERSION  commit=$(git rev-parse HEAD)"

      - name: Toolchain and runner architecture
        run: |
          set -euo pipefail
          swift --version
          sw_vers
          # Goblin Portal is Apple-silicon only (LSMinimumSystemVersion 14.0, arm64 build). If
          # GitHub ever changes what macos-26 provisions, an x86_64 runner would produce a
          # zip that launches for nobody on an M-series Mac and fails no other check here.
          if [ "$(uname -m)" != "arm64" ]; then
            echo "::error::runner is $(uname -m), expected arm64 — refusing to publish a cross-arch build"
            exit 1
          fi

      - name: Bootstrap vendored SwiftTerm
        working-directory: app
        run: ./Scripts/bootstrap-vendor.sh

      # Import the Developer ID certificate from a base64-encoded .p12 stored as a
      # GitHub secret. The keychain is temporary and lives only for this job — nothing
      # persists on the runner after the run finishes.
      - name: Install signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="build.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"

          # Create a temporary keychain and make it the default so codesign finds it.
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"

          # Import the .p12. -T /usr/bin/codesign allows codesign to use the key without
          # a GUI prompt (there is no GUI on a CI runner).
          echo "$CERTIFICATE_P12" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f /tmp/cert.p12

          # Allow codesign to access the imported key without prompting.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"

          # Verify the identity is available.
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build, sign, and notarise release bundle
        working-directory: app
        env:
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
          NOTARIZE_KEY_ID: ${{ secrets.NOTARIZE_KEY_ID }}
          NOTARIZE_ISSUER: ${{ secrets.NOTARIZE_ISSUER }}
          NOTARIZE_KEY: ${{ secrets.NOTARIZE_KEY }}
        run: |
          set -euo pipefail
          # Write the API key to a temp file — notarytool reads it from a path, not stdin.
          if [[ -n "${NOTARIZE_KEY_ID:-}" ]]; then
            KEY_PATH="/tmp/notarize-key.p8"
            umask 077 && printf '%s\n' "$NOTARIZE_KEY" > "$KEY_PATH"
            export NOTARIZE_KEY_PATH="$KEY_PATH"
          fi
          ./Scripts/make-app-bundle.sh release

      - name: Assert the built bundle is what the tag claims
        working-directory: app
        run: |
          set -euo pipefail
          APP="build/Goblin Portal.app"
          BUILT="$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")"
          if [ "v$BUILT" != "${{ steps.v.outputs.tag }}" ]; then
            echo "::error::built bundle reports $BUILT, tag is ${{ steps.v.outputs.tag }}"
            exit 1
          fi
          ARCH="$(lipo -archs "$APP/Contents/MacOS/GoblinPortal")"
          if [ "$ARCH" != "arm64" ]; then
            echo "::error::binary is '$ARCH', expected arm64"
            exit 1
          fi
          codesign -v --verbose=2 "$APP"

          # The hardened runtime flag must be present for notarisation to have succeeded.
          # codesign -d --verbose prints "flags=0x10000(runtime)" when it is; a build
          # that was only ad-hoc signed would print "flags=0x0(none)".
          if ! codesign -d --verbose=2 "$APP" 2>&1 | grep -q 'flags=.*runtime'; then
            echo "::error::hardened runtime flag not set — notarisation requires it"
            exit 1
          fi
          echo "  version=$BUILT arch=$ARCH signature=ok hardened-runtime=yes"

      # ditto, not zip. A plain `zip` does not preserve the extended attributes and
      # symlink structure a signed .app depends on, and the damage shows up only as a
      # broken signature on the DOWNLOADER's machine, never on the builder's.
      - name: Package zip
        working-directory: app
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent "build/Goblin Portal.app" "${{ steps.v.outputs.asset }}"
          shasum -a 256 "${{ steps.v.outputs.asset }}" > "${{ steps.v.outputs.asset }}.sha256"
          cat "${{ steps.v.outputs.asset }}.sha256"

      # Unpack the artifact that is about to be published and verify the signature
      # SURVIVED the round trip. This is the one failure that is invisible to every step
      # above: the app on disk is fine, the zip is the thing that is broken.
      - name: Verify the packaged zip, not the built app
        working-directory: app
        run: |
          set -euo pipefail
          rm -rf /tmp/verify && mkdir -p /tmp/verify
          ditto -x -k "${{ steps.v.outputs.asset }}" /tmp/verify
          codesign -v --verbose=2 "/tmp/verify/Goblin Portal.app"
          test -x "/tmp/verify/Goblin Portal.app/Contents/MacOS/GoblinPortal"
          test -f "/tmp/verify/Goblin Portal.app/Contents/Resources/Goblin Portal.icns"
          echo "  unpacked signature verifies; executable and icon present"

      # The DMG is the premium distribution artifact: background image, icon
      # positioning, and an Applications symlink for drag-to-install. The zip
      # stays as a fallback for Homebrew casks and scripted installs.
      - name: Package DMG
        working-directory: app
        run: |
          set -euo pipefail
          ./Scripts/make-dmg.sh "build/Goblin Portal.app" "GoblinPortal-${{ steps.v.outputs.tag }}.dmg"
          shasum -a 256 "GoblinPortal-${{ steps.v.outputs.tag }}.dmg" > "GoblinPortal-${{ steps.v.outputs.tag }}.dmg.sha256"
          cat "GoblinPortal-${{ steps.v.outputs.tag }}.dmg.sha256"

      # The DMG itself needs notarisation — Gatekeeper checks the disk image, not
      # just the .app inside it. The app was already notarised and stapled by
      # make-app-bundle.sh; this submits the DMG container so the user never sees
      # a quarantine dialog when opening the downloaded .dmg.
      - name: Notarise DMG
        if: env.NOTARIZE_KEY_ID != ''
        working-directory: app
        env:
          NOTARIZE_KEY_ID: ${{ secrets.NOTARIZE_KEY_ID }}
          NOTARIZE_ISSUER: ${{ secrets.NOTARIZE_ISSUER }}
        run: |
          set -euo pipefail
          DMG="GoblinPortal-${{ steps.v.outputs.tag }}.dmg"
          echo "==> notarising DMG (this takes 1–5 minutes)"
          xcrun notarytool submit "$DMG" \
            --key /tmp/notarize-key.p8 \
            --key-id "$NOTARIZE_KEY_ID" \
            --issuer "$NOTARIZE_ISSUER" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          echo "  DMG notarised and stapled"

      # Mount the DMG and verify the app inside it survived packaging with its
      # signature intact — the same round-trip check applied to the zip above.
      - name: Verify the packaged DMG
        working-directory: app
        run: |
          set -euo pipefail
          MOUNT="$(hdiutil attach "GoblinPortal-${{ steps.v.outputs.tag }}.dmg" -readonly -noverify -noautoopen | \
            grep '/Volumes/' | sed 's|.*\(/Volumes/.*\)|\1|' | head -1)"
          codesign -v --verbose=2 "$MOUNT/Goblin Portal.app"
          test -x "$MOUNT/Goblin Portal.app/Contents/MacOS/GoblinPortal"
          test -L "$MOUNT/Applications"  # symlink to /Applications must exist
          hdiutil detach "$MOUNT" -quiet
          echo "  DMG signature verifies; executable present; Applications symlink intact"

      # Scrub the signing key and notarisation credentials. The runner is ephemeral but
      # if: always() means this runs even on failure, so a red build never leaves a
      # keychain with a Developer ID key lying around.
      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain build.keychain-db 2>/dev/null || true
          rm -f /tmp/notarize-key.p8

      - name: Attach to the release
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          ASSET: ${{ steps.v.outputs.asset }}
        run: |
          set -euo pipefail
          # A tag push does not imply a release object exists. Create one only if absent;
          # never edit the notes of an existing release, which may have been hand-written.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "  no release for $TAG — creating with generated notes"
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          DMG="GoblinPortal-${TAG}.dmg"
          # --clobber so a re-run replaces rather than erroring on a duplicate name.
          gh release upload "$TAG" "$ASSET" "$ASSET.sha256" "$DMG" "$DMG.sha256" --clobber
          echo "  uploaded $ASSET + $DMG (+ checksums) built from $(git rev-parse HEAD)"
